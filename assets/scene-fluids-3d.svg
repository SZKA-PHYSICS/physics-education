<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 550" role="img" aria-label="3D fluid pressure glass U tube and transparent water vessels">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10384b"/><stop offset="1" stop-color="#176c7d"/></linearGradient>
 <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop stop-color="#8afbe2" stop-opacity=".63"/><stop offset="1" stop-color="#8afbe2" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#e6efff"/><stop offset=".23" stop-color="#526988"/><stop offset=".52" stop-color="#e4ecf4"/><stop offset=".76" stop-color="#51637e"/><stop offset="1" stop-color="#dce9ff"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#ecf8ff" stop-opacity=".5"/><stop offset=".2" stop-color="#fff" stop-opacity=".08"/><stop offset=".6" stop-color="#b7e4ff" stop-opacity=".22"/><stop offset=".86" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#e9ffff" stop-opacity=".58"/></linearGradient>
 <radialGradient id="sphere" cx=".28" cy=".19" r=".85"><stop stop-color="#fff"/><stop offset=".11" stop-color="#d4eeff"/><stop offset=".33" stop-color="#7f9fbf"/><stop offset=".67" stop-color="#223d64"/><stop offset="1" stop-color="#061528"/></radialGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7b19b" stop-opacity=".31"/><stop offset="1" stop-color="#492946" stop-opacity=".38"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="shine" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="720" height="550" fill="url(#bg)"/>
<ellipse cx="540" cy="135" rx="330" ry="260" fill="url(#g)"/>
<path d="M0 405 L720 370 V550 H0Z" fill="url(#desk)"/>
<path d="M0 407 L720 375" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
<ellipse cx="340" cy="458" rx="300" ry="51" fill="#071124" opacity=".56" filter="url(#shadow)"/>

<!-- glass U tube support stands -->
<rect x="105" y="390" width="510" height="28" rx="13" fill="#5a6a81" stroke="#a6d1dd" stroke-width="3"/>
<rect x="195" y="167" width="13" height="232" rx="5" fill="url(#metal)"/>
<rect x="525" y="144" width="13" height="255" rx="5" fill="url(#metal)"/>
<rect x="143" y="176" width="125" height="13" rx="6" fill="#c2d7e9"/>
<rect x="461" y="169" width="143" height="13" rx="6" fill="#c2d7e9"/>
<!-- U-shaped glass tube: linked columns at same level in absence of applied pressure difference -->
<path d="M272 102 L272 311 Q272 387 341 387 Q414 387 414 310 L414 102" fill="none" stroke="#e8fbff" stroke-width="46" opacity=".59"/>
<path d="M272 102 L272 311 Q272 387 341 387 Q414 387 414 310 L414 102" fill="none" stroke="#357ca3" stroke-width="34" opacity=".34"/>
<path d="M272 193 L272 310 Q272 387 341 387 Q414 387 414 310 L414 193" fill="none" stroke="#44bdea" stroke-width="30" opacity=".85"/>
<path d="M272 194 L272 310 Q272 387 341 387 Q414 387 414 310 L414 194" fill="none" stroke="#a9ffff" stroke-width="8" opacity=".68"/>
<path d="M248 193 H296 M390 193 H438" stroke="#b9ffff" stroke-width="5"/>
<path d="M248 110 L248 305 Q248 409 341 410 Q438 410 438 307 L438 110" stroke="#e6faff" stroke-width="4" opacity=".88" fill="none"/>
<!-- left beaker -->
<path d="M70 176 L85 354 Q88 369 105 369 H182 Q198 369 203 350 L219 176" stroke="#b9e9f4" stroke-width="6" fill="url(#glass)"/>
<path d="M83 245 H204 L195 350 Q191 360 180 360 H108 Q94 360 92 349Z" fill="#2dbfe4" opacity=".75"/>
<ellipse cx="144" cy="245" rx="61" ry="9" fill="#befaff" opacity=".8"/>
<path d="M84 174 Q144 163 218 174" stroke="#fff" stroke-opacity=".68" stroke-width="7" fill="none"/>
<!-- right pressure gauge 3D -->
<path d="M520 316 L520 266" stroke="url(#metal)" stroke-width="16"/>
<circle cx="521" cy="218" r="72" fill="#37556d" stroke="#d0e2ea" stroke-width="11"/>
<circle cx="518" cy="213" r="55" fill="#e9ffff" stroke="#d4f8ff" stroke-width="5"/>
<path d="M475.7 206.5 L467.8 205.1" stroke="#1a5671" stroke-width="3"/><path d="M481.5 191.2 L474.7 187.0" stroke="#1a5671" stroke-width="3"/><path d="M492.7 179.2 L488.0 172.7" stroke="#1a5671" stroke-width="3"/><path d="M507.6 172.3 L505.7 164.5" stroke="#1a5671" stroke-width="3"/><path d="M524.0 171.4 L525.1 163.5" stroke="#1a5671" stroke-width="3"/><path d="M539.5 176.8 L543.5 169.8" stroke="#1a5671" stroke-width="3"/><path d="M551.9 187.5 L558.2 182.6" stroke="#1a5671" stroke-width="3"/><path d="M559.3 202.1 L567.0 199.9" stroke="#1a5671" stroke-width="3"/><path d="M560.8 218.5 L568.7 219.3" stroke="#1a5671" stroke-width="3"/>
<path d="M518 215 L549 183" stroke="#ff665e" stroke-width="7" stroke-linecap="round"/>
<circle cx="518" cy="215" r="9" fill="#244b64"/>
<!-- depth measure -->
<path d="M224 185 L224 380" stroke="#b9e6f3" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M222 194 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 215 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 236 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 257 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 278 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 299 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 320 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 341 h-10" stroke="#d8f3f8" stroke-width="2"/><path d="M222 362 h-10" stroke="#d8f3f8" stroke-width="2"/>
<circle cx="92" cy="95" r="45" fill="#a6ffff" opacity=".18" filter="url(#shadow)"/>

</svg>