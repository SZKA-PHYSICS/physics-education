<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 550" role="img" aria-label="3D optics laboratory scene with glass prism and rainbow laser">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a4a"/><stop offset="1" stop-color="#482176"/></linearGradient>
 <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop stop-color="#9054fd" stop-opacity=".63"/><stop offset="1" stop-color="#9054fd" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#e6efff"/><stop offset=".23" stop-color="#526988"/><stop offset=".52" stop-color="#e4ecf4"/><stop offset=".76" stop-color="#51637e"/><stop offset="1" stop-color="#dce9ff"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#ecf8ff" stop-opacity=".5"/><stop offset=".2" stop-color="#fff" stop-opacity=".08"/><stop offset=".6" stop-color="#b7e4ff" stop-opacity=".22"/><stop offset=".86" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#e9ffff" stop-opacity=".58"/></linearGradient>
 <radialGradient id="sphere" cx=".28" cy=".19" r=".85"><stop stop-color="#fff"/><stop offset=".11" stop-color="#d4eeff"/><stop offset=".33" stop-color="#7f9fbf"/><stop offset=".67" stop-color="#223d64"/><stop offset="1" stop-color="#061528"/></radialGradient>
 <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7b19b" stop-opacity=".31"/><stop offset="1" stop-color="#492946" stop-opacity=".38"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="shine" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="720" height="550" fill="url(#bg)"/>
<ellipse cx="540" cy="135" rx="330" ry="260" fill="url(#g)"/>
<path d="M0 405 L720 370 V550 H0Z" fill="url(#desk)"/>
<path d="M0 407 L720 375" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
<ellipse cx="340" cy="458" rx="300" ry="51" fill="#071124" opacity=".56" filter="url(#shadow)"/>

<!-- optical rail and mounts -->
<path d="M82 415 L602 385 L641 409 L127 443Z" fill="#9ab5dc" opacity=".5"/>
<path d="M85 413 L599 384" stroke="#d1edff" stroke-width="9"/><path d="M115 438 L642 406" stroke="#394060" stroke-width="14"/>
<ellipse cx="190" cy="442" rx="86" ry="17" fill="#060c29" opacity=".7"/>
<rect x="172" y="340" width="21" height="83" rx="6" fill="url(#metal)"/>
<path d="M110 365 L180 354 L196 366 L126 383Z" fill="#273955" stroke="#bde2ff" stroke-width="3"/>
<circle cx="155" cy="371" r="21" fill="#193559" stroke="#a9cee4" stroke-width="6"/>
<circle cx="153" cy="369" r="9" fill="#f4feff"/>
<!-- spectral output physically emanating from prism -->
<path d="M395 315 L660 170 L680 177 L401 329Z" fill="#ff3a64" opacity=".87" filter="url(#shine)"/>
<path d="M395 315 L665 204 L682 214 L404 332Z" fill="#ffae3e" opacity=".9" filter="url(#shine)"/>
<path d="M395 315 L671 232 L691 241 L407 336Z" fill="#ffe461" opacity=".82" filter="url(#shine)"/>
<path d="M395 315 L665 262 L682 272 L406 340Z" fill="#4eeaaa" opacity=".82" filter="url(#shine)"/>
<path d="M395 315 L676 295 L692 304 L405 341Z" fill="#42b4ff" opacity=".84" filter="url(#shine)"/>
<path d="M395 315 L666 328 L682 338 L407 344Z" fill="#a67dff" opacity=".8" filter="url(#shine)"/>
<path d="M195 366 L335 334" stroke="#fff" stroke-width="7" opacity=".85" filter="url(#soft)"/>
<path d="M195 366 L335 334" stroke="#d7ffff" stroke-width="3"/>
<!-- glass triangular prism in perspective -->
<path d="M304 381 L369 200 L447 370Z" fill="url(#glass)" stroke="#d3edff" stroke-width="5"/>
<path d="M304 381 L358 404 L481 393 L447 370Z" fill="#a4efff" opacity=".18" stroke="#c3f5ff" stroke-width="3"/>
<path d="M369 200 L403 221 L481 393 L447 370Z" fill="#73d5ff" opacity=".16" stroke="#e3f7ff" stroke-width="3"/>
<path d="M369 200 L358 404" stroke="#efffff" stroke-width="3" opacity=".62"/>
<path d="M313 372 L438 365" stroke="#fff" opacity=".32" stroke-width="7"/>
<circle cx="374" cy="329" r="28" fill="#fff" opacity=".15" filter="url(#soft)"/>
<!-- vivid decorative lab lighting -->
<circle cx="596" cy="80" r="54" fill="#e686ff" opacity=".3" filter="url(#shadow)"/>
<circle cx="125" cy="127" r="43" fill="#44e3fe" opacity=".4" filter="url(#shadow)"/>

</svg>