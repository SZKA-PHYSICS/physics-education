const state = {page:'home',selected:null,quizIndex:0,quizAnswers:[], progress:(stored.progress&&typeof stored.progress==='object')?stored.progress:{}, params:{}, filter:'',view:'lab'};
const defaults = m => Object.fromEntries(m.params.map(p=>[p[0],p[6]]));
const getP = m => (state.params[m.id] ||= defaults(m));
const save = () => {try {localStorage.setItem(STORAGE_KEY,JSON.stringify({progress:state.progress}))} catch(e) { console.warn('Local storage not available',e) }};
function pick(id){const m=MODULES.find(x=>x.id===id); if(!m)return; state.page='module'; state.selected=id;state.quizIndex=0;state.quizAnswers=Array(m.qs.length).fill(null);state.view='lab';window.location.hash='lesson-'+id;render();window.scrollTo(0,0)}
function goHome(){state.page='home';state.selected=null;window.location.hash='home';render();window.scrollTo(0,0)}
function goOwner(){state.page='owner';state.selected=null;window.location.hash='owner';render();window.scrollTo(0,0)}
const totalComplete=()=>MODULES.filter(m=>state.progress[m.id]?.done).length;
const meanScore=()=>{const a=Object.values(state.progress).filter(x=>x.done).map(x=>x.best);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0};
const makeSvg = (m, inner) => `<svg viewBox="0 0 520 320" aria-label="نمای شماتیک آزمایش ${esc(m.title)}" role="img" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b4c7df" stroke-opacity=".14" stroke-width="1"/></pattern><linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#67dddf" stop-opacity=".55"/><stop offset="1" stop-color="#4786e8" stop-opacity=".78"/></linearGradient></defs><rect width="520" height="320" rx="24" fill="#0e1a35"/><rect width="520" height="320" rx="24" fill="url(#grid)"/>${inner}</svg>`;
const svgText=(x,y,t,size=13,fill='#c5d8f5',anchor='middle')=>`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${anchor}" fill="${fill}" font-family="Tahoma,Arial,sans-serif">${esc(t)}</text>`;
const line=(x1,y1,x2,y2,color='#80e6d8',w=3,extras='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" ${extras}/>`;
function getResult(m,p){
 switch(m.id){
 case 'motion':{const v=p.v0+p.a*p.t,x=p.v0*p.t+.5*p.a*p.t*p.t;return {main:fmt(x),unit:'متر جابه‌جایی',side:[['سرعت نهایی',fmt(v)+' m/s'],['زمان',fmt(p.t)+' s']],insight:`سرعت نهایی ${fmt(v)} m/s و جابه‌جاییِ علامت‌دار ${fmt(x)} متر است. اگر جهت حرکت عوض شود، مسافت کل می‌تواند بیشتر از قدرمطلق جابه‌جایی باشد.`}}
 case 'forces': {const a=p.F/p.m;return{main:fmt(a),unit:'m/s² شتاب',side:[['جرم',fmt(p.m)+' kg'],['نیروی خالص',fmt(p.F)+' N']],insight:`شتاب ${fmt(a)} m/s² است. ${p.F===0?'نیروی خالص صفر است؛ شتاب صفر، نه لزوماً سرعت.':'علامت شتاب، جهت نیروی خالص را نشان می‌دهد.'}`}}
 case 'energy':{const ek=.5*p.m*p.v*p.v,ep=p.m*9.8*p.h;return{main:fmt(ek+ep),unit:'ژول انرژی مکانیکی',side:[['جنبشی',fmt(ek)+' J'],['پتانسیل',fmt(ep)+' J']],insight:`در این لحظه Eₖ=${fmt(ek)} و U=${fmt(ep)} ژول؛ مجموع این دو ${fmt(ek+ep)} ژول است (بدون احتساب انرژی‌های دیگر).`}}
 case 'pressure':{const q=p.rho*9.8*p.h;return{main:fmt(q/1000),unit:'کیلوپاسکال فشار پیمانه‌ای',side:[['چگالی',fmt(p.rho)+' kg/m³'],['عمق',fmt(p.h)+' m']],insight:`ΔP = ${fmt(p.rho)} × ۹٫۸ × ${fmt(p.h)} = ${fmt(q)} پاسکال. فشار مطلق برابر فشار سطح آزاد به‌علاوهٔ این مقدار است.`}}
 case 'electricity':{const i=p.V/p.R,power=p.V*i;return{main:fmt(i),unit:'آمپر جریان',side:[['توان مصرفی',fmt(power)+' W'],['مقاومت',fmt(p.R)+' Ω']],insight:`جریان ${fmt(i)} آمپر و توان مقاومت ${fmt(power)} وات است. این مدل برای مقاومت اهمی و منبع ایدئال است.`}}
 case 'reflection':return{main:fmt(p.angle)+'°',unit:'زاویهٔ بازتاب',side:[['زاویهٔ تابش',fmt(p.angle)+'°'],['زاویه با سطح آینه',fmt(90-p.angle)+'°']],insight:'هر دو زاویه نسبت به خط عمود بر آینه اندازه‌گیری شده‌اند؛ مسیرها نسبت به این خط متقارن‌اند.'};
 case 'lens':{const di=p.f*p.d/(p.d-p.f),mag=-di/p.d;return{main:fmt(di),unit:'سانتی‌متر فاصلهٔ تصویر',side:[['بزرگ‌نمایی علامت‌دار',fmt(mag)],['نوع تصویر','حقیقی، وارونه']],insight:`فاصلهٔ تصویر ${fmt(di)} cm و بزرگ‌نمایی ${fmt(mag)} است؛ علامت منفی یعنی تصویر وارونه است.`}}
 case 'waves':{const v=p.f*p.lambda;return{main:fmt(v),unit:'m/s تندی موج',side:[['بسامد',fmt(p.f)+' Hz'],['طول موج',fmt(p.lambda)+' m']],insight:`تندی انتشار برابر ${fmt(p.f)} × ${fmt(p.lambda)} = ${fmt(v)} متر بر ثانیه است. دامنه در این مدل، تندی انتشار را تعیین نمی‌کند.`}}
 case 'sound':{const v=331+.6*p.T,lam=v/p.f;return{main:fmt(lam),unit:'متر طول موج',side:[['تندی تقریبی صوت',fmt(v)+' m/s'],['بسامد',fmt(p.f)+' Hz']],insight:`با تقریب مخصوص هوای خشک، v≈${fmt(v)} m/s و λ=${fmt(lam)} متر. این مدل برای دماهای نزدیک اتاق است.`}}
 case 'heat':{const q=p.m*p.c*p.dT;return{main:fmt(q/1000),unit:'کیلوژول گرمای مبادله‌شده',side:[['جرم',fmt(p.m)+' kg'],['تغییر دما',fmt(p.dT)+' °C']],insight:`Q=${fmt(q)} ژول؛ ${q>0?'علامت مثبت به معنی دریافت گرما در این قرارداد است.':q<0?'علامت منفی به معنی از دست دادن گرماست.':'تغییر دما صفر است؛ انتقال گرمای محاسبه‌شده نیز صفر است.'}`}}
 case 'density':{const rho=p.m/p.vol;return{main:fmt(rho),unit:'kg/L چگالی میانگین',side:[['بر حسب SI',fmt(rho*1000)+' kg/m³'],['در آب ساکن',rho<1?'شناوری':rho>1?'فرو رفتن':'تعادل مرزی']],insight:`چگالی جسم ${fmt(rho)} kg/L است. ${rho<1?'از آب کمتر است؛ در مدل ایدئال بخشی از جسم بیرون آب می‌ماند.':rho>1?'از آب بیشتر است؛ در مدل ایدئال جسم فرو می‌رود.':'با آب برابر است؛ در مدل ایدئال امکان شناوری خنثی وجود دارد.'}`}}
 case 'magnetism':{const b=20*p.I/p.r;return{main:fmt(b),unit:'میکروتسلا میدان',side:[['جریان',fmt(p.I)+' A'],['فاصله',fmt(p.r)+' cm']],insight:`اندازهٔ میدان ناشی از سیمِ بلند در این فاصله ${fmt(b)} μT است؛ جهت میدان با دست راست تعیین می‌شود.`}}
 case 'gravity':{const w=p.m*p.g;return{main:fmt(w),unit:'نیوتن وزن',side:[['جرم ثابت',fmt(p.m)+' kg'],['شتاب گرانش',fmt(p.g)+' m/s²']],insight:`وزن برابر ${fmt(p.m)} × ${fmt(p.g)} = ${fmt(w)} N است؛ جرم جسم با تغییر میدان گرانش تغییر نمی‌کند.`}}
 case 'nuclear':{const remain=p.N0*Math.pow(.5,p.t/p.half),percent=100*remain/p.N0;return{main:fmt(percent)+'٪',unit:'سهم مورد انتظار باقی‌مانده',side:[['تعداد باقی‌مانده',fmt(remain)+' هزار'],['نیمه‌عمر سپری‌شده',fmt(p.t/p.half)]],insight:`بعد از ${fmt(p.t/p.half)} نیمه‌عمر، مقدار مورد انتظار برابر ${fmt(remain)} هزار هسته است؛ رفتار یک هستهٔ منفرد قابل پیش‌بینی دقیق نیست.`}}
 }
}
function scene(m,p){
 let s='',id=m.id;
 if(id==='motion'){
  let coords=[];for(let i=0;i<=60;i++){let t=p.t*i/60,v=p.v0*t+.5*p.a*t*t;coords.push([t,v])}let vals=coords.map(c=>c[1]),lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(hi-lo<1){hi+=.5;lo-=.5}const X=t=>55+420*(p.t? t/p.t:0),Y=v=>255-190*(v-lo)/(hi-lo);s+=line(55,255,475,255,'#93aecb',2)+line(55,255,55,30,'#93aecb',2);s+=`<polyline points="${coords.map(([t,v])=>`${X(t)},${Y(v)}`).join(' ')}" fill="none" stroke="#78e5d8" stroke-width="4" stroke-linecap="round"/>`;s+=`<circle cx="${X(p.t)}" cy="${Y(p.v0*p.t+.5*p.a*p.t*p.t)}" r="7" fill="#ffe09a"/>`;s+=svgText(263,293,'نمودار مکان ـ زمان (جابه‌جایی علامت‌دار)')+svgText(90,34,'x (m)')+svgText(463,268,'t (s)');
 } else if(id==='forces'){

 } else if(id==='energy'){
  let y=245-p.h*7;s+=line(85,250,430,250,'#85a9bc',3)+`<circle cx="256" cy="${y}" r="24" fill="#ffc06c"/>`+line(300,y,300,250,'#abd1ed',2,'stroke-dasharray="6 6"')+svgText(350,y+8,`${fmt(p.h)} m`,16)+svgText(256,298,'تراز مرجع انرژی پتانسیل',13);let ek=.5*p.m*p.v*p.v,ep=p.m*9.8*p.h,mx=Math.max(ek,ep,1);s+=`<rect x="68" y="${250-110*ek/mx}" width="28" height="${110*ek/mx}" rx="5" fill="#f6a5d5"/><rect x="109" y="${250-110*ep/mx}" width="28" height="${110*ep/mx}" rx="5" fill="#6fdfcd"/>`+svgText(83,275,'جنبشی',10)+svgText(123,275,'پتانسیل',10);
 } else if(id==='pressure'){
  let y=60+215*p.h/8;s+=`<path d="M155 55V275H370V55" stroke="#a0c5da" stroke-width="8" fill="none" stroke-linejoin="round"/><rect x="160" y="60" width="205" height="210" fill="url(#water)"/><path d="M155 60H370" stroke="#f0f6ff" stroke-width="3"/>`+line(160,y,365,y,'#ffe8a2',3,'stroke-dasharray="9 7"')+`<circle cx="260" cy="${y}" r="8" fill="#fff2b8"/>`+svgText(420,y+3,`${fmt(p.h)} m`,16)+svgText(260,40,'سطح آزاد؛ فشار پیمانه‌ای صفر')+svgText(260,303,'مایع ساکن با چگالی ثابت');
 } else if(id==='electricity'){
  s+=`<path d="M105 90H415V244H105V90" fill="none" stroke="#7bd7da" stroke-width="6" stroke-linejoin="round"/>`+`<rect x="210" y="72" width="100" height="36" rx="8" fill="#0e1a35"/><path d="M218 90l12 -12l12 24l12 -24l12 24l12 -24l12 12" fill="none" stroke="#fcbf80" stroke-width="4"/>`+`<rect x="87" y="146" width="37" height="52" fill="#0e1a35"/>`+line(93,156,117,156,'#f8fcff',4)+line(98,169,113,169,'#f8fcff',3)+svgText(260,58,`R = ${fmt(p.R)} Ω`,18)+svgText(67,185,`${fmt(p.V)} V`,16)+`<circle cx="415" cy="165" r="34" fill="#f8cd70" fill-opacity="${.12+.8*p.V/24}" stroke="#ffdb88" stroke-width="4"/>`+svgText(415,171,'I',23,'#e6effc')+svgText(260,288,'مدار بسته با مقاومت اهمی ایدئال');
 } else if(id==='reflection'){
  let a=p.angle*Math.PI/180,x=170*Math.sin(a),y=170*Math.cos(a);s+=line(90,235,430,235,'#c6d7ee',7)+line(260,48,260,255,'#9bb3d1',2,'stroke-dasharray="7 6"')+line(260-x,235-y,260,235,'#ffcf85',4)+line(260,235,260+x,235-y,'#75dfdb',4)+`<circle cx="260" cy="235" r="7" fill="#fff"/>`+svgText(120,268,'آینهٔ تخت',16)+svgText(258,33,'عمود بر سطح')+svgText(260-x/2-17,225-y/2,`تابش`,15,'#ffcf85')+svgText(260+x/2+17,225-y/2,`بازتاب`,15,'#75dfdb');
 } else if(id==='lens'){
  const di=p.f*p.d/(p.d-p.f),ximg=Math.min(455,305+Math.min(di,90)*1.5),imgheight=Math.min(95,60*di/p.d);s+=line(32,214,490,214,'#a3bad2',2,'stroke-dasharray="8 5"')+`<path d="M260 50 Q213 155 260 274 Q307 155 260 50" fill="#57bdde" fill-opacity=".35" stroke="#8fe6ff" stroke-width="3"/>`+line(97,213,97,135,'#ffcd90',5)+`<polygon points="97,124 87,146 107,146" fill="#ffcd90"/>`+line(ximg,214,ximg,214+imgheight,'#e9a7fb',5)+`<polygon points="${ximg},${222+imgheight} ${ximg-10},${202+imgheight} ${ximg+10},${202+imgheight}" fill="#e9a7fb"/>`+line(97,135,260,135,'#ffcd90',2)+line(260,135,ximg,214+imgheight,'#ffcd90',2)+line(97,135,ximg,214+imgheight,'#c9ecf5',2,'stroke-dasharray="5 5"')+svgText(100,109,'جسم')+svgText(ximg,285,'تصویر')+svgText(260,30,'عدسی همگرا')+svgText(260,306,'شکل شماتیک؛ فاصله‌ها به مقیاس نیستند',12);
 } else if(id==='waves'){
  const freq= Math.min(13,Math.max(1.5,8/p.lambda)),am=p.A*32;let pts=[];for(let i=0;i<=420;i+=3){pts.push(`${50+i},${158-am*Math.sin(i/420*freq*Math.PI*2)}`)}s+=line(45,159,478,159,'#516b8a',2,'stroke-dasharray="6 6"')+`<polyline points="${pts.join(' ')}" fill="none" stroke="#78dfd8" stroke-width="4" stroke-linejoin="round"/>`+svgText(260,44,'موج عرضی سینوسی؛ نمای ایستا',18)+svgText(260,288,`دامنهٔ نسبی: ${fmt(p.A)} — بسامد: ${fmt(p.f)} Hz`);
 } else if(id==='sound'){
  for(let i=0;i<38;i++){let dense=Math.sin(i*.42*(p.f/250))**2;let x=40+i*12; s+=line(x,90+dense*19,x,231-dense*19,'#80e4df',1.5+dense*4)}s+=svgText(260,54,'ناحیه‌های تراکم و انبساط هوا',19)+svgText(260,278,'انتشار موج طولی صوت در هوا',15);
 } else if(id==='heat'){
  const len=140*(p.dT+30)/80;s+=`<rect x="222" y="65" width="76" height="186" rx="35" fill="#18284c" stroke="#9ab7d5" stroke-width="4"/><circle cx="260" cy="250" r="33" fill="#fa7a71"/><rect x="248" y="${226-len}" width="24" height="${len+27}" rx="12" fill="#fa7a71"/>`+svgText(260,36,'دماسنج شماتیک',20)+svgText(390,150,`ΔT = ${fmt(p.dT)} °C`,19)+svgText(390,192,p.dT>=0?'گرم‌شدن':'سردشدن',16);
 } else if(id==='density'){
  const rho=p.m/p.vol,y=rho<1?134:rho>1?187:161;s+=`<rect x="104" y="157" width="308" height="113" rx="14" fill="url(#water)"/>`+line(104,158,412,158,'#c7f3fb',3)+`<rect x="211" y="${y}" width="97" height="80" rx="12" fill="#f7b979" stroke="#ffe6b4" stroke-width="2"/>`+svgText(260,110,`${fmt(rho)} kg/L`,22)+svgText(260,291,'سطح آب — چگالی تقریبی ۱ kg/L',14);
 } else if(id==='magnetism'){

 } else if(id==='gravity'){
  let r=56;s+=`<circle cx="258" cy="117" r="${r}" fill="#6e91ee"/><path d="M222 100Q243 79 258 100T300 123" stroke="#90e3cc" stroke-width="12" fill="none" opacity=".8"/>`+`<circle cx="258" cy="201" r="19" fill="#ffd493"/>`+line(258,225,258,279,'#f5a7c0',6)+`<polygon points="258,293 244,268 272,268" fill="#f5a7c0"/>`+svgText(366,255,'نیروی وزن',19)+svgText(258,36,'میدان گرانشی تقریبی',18);
 } else if(id==='nuclear'){

}
function statUi(){const count=totalComplete(),mean=meanScore();return `<div class="metric"><div class="metric-icon">◈</div><div><strong>${fmt(MODULES.length)}</strong><span>آزمایشگاه تعاملی</span></div></div><div class="metric"><div class="metric-icon">✓</div><div><strong>${fmt(count)}</strong><span>درس تکمیل‌شده</span></div></div><div class="metric"><div class="metric-icon">★</div><div><strong>${fmt(mean)}٪</strong><span>میانگین بهترین نمره</span></div></div>`}
function renderNav(){const nav=byId('courseNav');nav.innerHTML=`<button class="nav-link ${state.page==='home'?'active':''}" data-home="true"><span class="nav-symbol">⌂</span> نمای کلی <span class="nav-trailing">⌄</span></button><div class="nav-title">فصل‌های فیزیک</div>`+MODULES.map(m=>`<button class="nav-link ${state.selected===m.id?'active':''}" data-module="${m.id}"><span class="nav-symbol" style="color:${m.color}">${m.icon}</span><span>${m.title}</span>${state.progress[m.id]?.done?'<span class="nav-done">✓</span>':''}</button>`).join('')+`<div class="nav-title">پروژه</div><button class="nav-link ${state.page==='owner'?'active':''}" data-owner="true"><span class="nav-symbol">♙</span> مالکیت و شناسنامه</button>`;byId('navOwner').textContent=PRODUCT_OWNER;}
function renderHome(){byId('topTitle').textContent='داشبورد آموزش فیزیک';byId('mainContent').innerHTML=`<section class="hero"><div class="hero-copy"><div class="hero-kicker"><span class="spark">✦</span> نسخهٔ ۱٫۰٫۱ • کاملاً فارسی • بدون اینترنت</div><h1>فیزیک را <em>تجربه</em> کن،<br>نه فقط حفظ!</h1><p>آزمایشگاه مجازی برای دیدنِ قانون‌های فیزیک؛ عددها را تغییر بده، نتیجه را ببین و دانسته‌هایت را محک بزن.</p><div class="hero-actions"><button class="primary-btn" data-module="motion">شروع یادگیری <span aria-hidden="true">←</span></button><button class="outline-btn" data-owner="true">شناسنامهٔ نرم‌افزار</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit a"></div><div class="orbit b"></div><div class="planet core">Φ</div><span class="float-particle one">✦</span><span class="float-particle two">+</span><span class="float-particle three">∿</span><span class="float-particle four">○</span></div></section><section class="metrics" aria-label="آمار پیشرفت">${statUi()}</section><div class="section-header"><div><span class="eyebrow">کاوش در فیزیک</span><h2>آزمایشگاه‌ها و درس‌ها</h2><p>هر درس یک مدل تعاملی، توضیح علمی و چهار پرسش دارد.</p></div><label class="search-field"><span>⌕</span><input id="topicSearch" type="search" placeholder="جست‌وجوی مبحث ..." value="${esc(state.filter)}" aria-label="جست‌وجوی مبحث"/></label></div><div id="moduleGrid" class="module-grid">${MODULES.map((m,i)=>`<button class="module-card" style="--accent:${m.color};--i:${i}" data-module="${m.id}" data-search="${esc(m.title+' '+m.sub+' '+m.cat)}"><span class="mod-top"><span class="mod-icon">${m.icon}</span><span class="mod-chapter">${esc(m.cat)}</span></span><strong>${m.title}</strong><span class="mod-sub">${m.sub}</span><span class="mod-bottom"><span>${fmt(m.time)} دقیقه · ۴ سؤال</span><span class="mod-arrow">↖</span></span>${state.progress[m.id]?.done?'<span class="completed">✓ تکمیل‌شده</span>':''}</button>`).join('')}</div><div id="emptySearch" class="empty hide">مبحثی با این عنوان پیدا نشد.</div><section class="bottom-note"><span class="small-sun">✦</span><div><strong>یادگیری با آزمایش، نه حفظ فرمول</strong><p>این مجموعه مدل‌های ساده‌شدهٔ آموزشی دارد؛ قبل از استفاده رسمی از نظر تناسب با پایهٔ تحصیلی بررسی شود.</p></div></section>`;const input=byId('topicSearch');input.addEventListener('input',ev=>{state.filter=ev.target.value;const q=state.filter.trim().toLocaleLowerCase('fa');let n=0;byId('moduleGrid').querySelectorAll('.module-card').forEach(el=>{let show=el.dataset.search.toLocaleLowerCase('fa').includes(q);el.hidden=!show;if(show)n++});byId('emptySearch').classList.toggle('hide',!!n)});input.dispatchEvent(new Event('input'));}
function renderModule(){const m=MODULES.find(m=>m.id===state.selected),p=getP(m);byId('topTitle').textContent=m.title;const result=getResult(m,p);byId('mainContent').innerHTML=`<div class="backline"><button class="back-link" data-home="true">→ بازگشت به همهٔ درس‌ها</button><span class="small-label">${esc(m.cat)} / ${esc(m.title)}</span></div><div class="lesson-hero" style="--accent:${m.color}"><div class="lesson-badge">${m.icon}</div><div class="lesson-titles"><span class="eyebrow">آزمایشگاه ${esc(m.cat)}</span><h1>${m.title}</h1><p>${m.sub}</p></div><span class="lesson-minutes">◷ ${fmt(m.time)} دقیقه</span></div><div class="tabs" role="tablist" aria-label="بخش‌های درس"><button class="tab ${state.view==='lab'?'selected':''}" data-view="lab" role="tab" aria-selected="${state.view==='lab'}">◈ آزمایشگاه</button><button class="tab ${state.view==='learn'?'selected':''}" data-view="learn" role="tab" aria-selected="${state.view==='learn'}">▤ درس‌نامه</button><button class="tab ${state.view==='quiz'?'selected':''}" data-view="quiz" role="tab" aria-selected="${state.view==='quiz'}">✓ ارزشیابی</button><button class="tab ${state.view==='teacher'?'selected':''}" data-view="teacher" role="tab" aria-selected="${state.view==='teacher'}">♙ راهنمای دبیر</button></div><div id="sectionView"></div>`;renderSection(m)}
function renderSection(m){const target=byId('sectionView'),p=getP(m),res=getResult(m,p);if(state.view==='lab'){
 target.innerHTML=`<div class="lab-intro"><span class="intro-dot">✦</span><div><strong>پرسش پژوهشی</strong><p>${m.intro}</p></div></div><div class="lab-layout"><section class="card controls-card"><div class="card-head"><h2>کنترل آزمایش</h2><button class="reset-button" id="resetExperiment">↻ بازنشانی</button></div>${m.params.map(([key,label,unit,min,max,step],i)=>`<div class="control"><label for="range-${key}">${esc(label)} <span class="control-value" id="val-${key}">${fmt(p[key])} <small>${esc(unit)}</small></span></label><input type="range" id="range-${key}" data-range="${key}" min="${min}" max="${max}" step="${step}" value="${p[key]}" style="--accent:${m.color}"/><div class="range-ends"><span>${fmt(min)}</span><span>${fmt(max)}</span></div></div>`).join('')}<div class="formula-box"><span>رابطهٔ اصلی</span><strong dir="ltr">${m.formula}</strong></div></section><section class="card visual-card"><div class="card-head"><h2>نمای آزمایش</h2><span class="live-chip"><span></span> تعاملی</span></div><div class="scene" id="liveScene">${scene(m,p)}</div><div class="readout"><div class="readout-main"><span>نتیجهٔ محاسبه</span><strong id="mainResult">${res.main}</strong><small id="mainUnit">${res.unit}</small></div><div class="readout-side" id="sideResults">${res.side.map(([k,v])=>`<div><span>${k}</span><strong dir="auto">${v}</strong></div>`).join('')}</div></div></section></div><section class="card insight-card"><span class="insight-icon">✧</span><div><h3>تحلیل علمی آزمایش</h3><p id="liveInsight">${res.insight}</p></div></section><section class="lab-bottom"><div class="micro-card"><span>□ هدف یادگیری</span><p>${m.outcome}</p></div><div class="micro-card"><span>⌁ یک چالش برای تو</span><p>${m.challenge}</p></div></section><div class="go-next"><button class="primary-btn" data-view="quiz">حالا خودت را بیازما ←</button><button class="soft-btn" data-view="learn">خواندن درس‌نامه</button></div>`;
 target.querySelectorAll('[data-range]').forEach(input=>input.addEventListener('input',ev=>{const key=ev.target.dataset.range;p[key]=Number(ev.target.value);byId('val-'+key).innerHTML=`${fmt(p[key])} <small>${esc(m.params.find(x=>x[0]===key)[2])}</small>`;const r=getResult(m,p);byId('mainResult').textContent=r.main;byId('mainUnit').textContent=r.unit;byId('sideResults').innerHTML=r.side.map(([k,v])=>`<div><span>${k}</span><strong dir="auto">${v}</strong></div>`).join('');byId('liveInsight').textContent=r.insight;byId('liveScene').innerHTML=scene(m,p)}));byId('resetExperiment').onclick=()=>{state.params[m.id]=defaults(m);renderSection(m)};
 } else if(state.view==='learn'){
 target.innerHTML=`<div class="learning-layout"><section class="card reading"><span class="eyebrow">اصل فیزیکی</span><h2>${m.title}</h2><p class="reading-lead">${m.intro}</p><div class="formula-large" dir="ltr">${m.formula}</div><h3>هدف رفتاری</h3><p>${m.outcome}</p><h3>محدودهٔ اعتبار مدل</h3><p>${m.assumptions}</p><div class="tip-box"><strong>نکتهٔ کلیدی</strong><p>${m.tip}</p></div><h3>فعالیت اکتشافی</h3><p>${m.challenge}</p><button data-view="lab" class="primary-btn">اجرای آزمایش ←</button></section><aside class="card sidebar-note"><h3>چرخهٔ یادگیری</h3><ol><li>پیش‌بینی نتیجه قبل از تغییر پارامترها</li><li>تغییر یک متغیر و ثابت نگه‌داشتن بقیه</li><li>مقایسهٔ خروجی با رابطهٔ فیزیکی</li><li>پاسخ به چهار پرسش و بررسی بازخورد</li></ol><p class="note-muted">برای استناد علمی و بررسی فرض‌های هر مدل، فایل «مبانی و منابع علمی» را در بستهٔ کامل مطالعه کنید.</p></aside></div>`;
 } else if(state.view==='quiz'){renderQuiz(m);return;
 } else if(state.view==='teacher'){
 target.innerHTML=`<div class="learning-layout"><section class="card reading"><span class="eyebrow">طرح تدریس کوتاه</span><h2>راهنمای دبیر: ${m.title}</h2><h3>هدف یادگیری قابل مشاهده</h3><p>${m.outcome}</p><h3>شروع کلاس — ۳ دقیقه</h3><p>از دانش‌آموزان بخواهید بدون محاسبه، اثر تغییر یکی از متغیرها را پیش‌بینی کنند.</p><h3>آزمایش گروهی — ۷ دقیقه</h3><p>دانش‌آموزان دو مقدار مختلف از یک پارامتر را آزمایش کنند، خروجی‌ها را یادداشت کرده و سایر متغیرها را ثابت نگه دارند.</p><h3>بحث و بازخورد — ۳ دقیقه</h3><p>${m.tip}</p><h3>ارزشیابی تکوینی — ${Math.max(m.time-13,3)} دقیقه</h3><p>چهار پرسش بخش «ارزشیابی» را پاسخ دهند و دلیل انتخاب هر گزینه را بیان کنند.</p><div class="tip-box"><strong>مرز اعتبار</strong><p>${m.assumptions}</p></div><button class="primary-btn" data-view="quiz">ورود به ارزشیابی ←</button></section><aside class="card sidebar-note"><h3>روش پیشنهادی</h3><p>پیش‌بینی ← مشاهده ← توضیح (POE)</p><p class="note-muted">زمان‌ها تقریبی‌اند. سطح سؤال و مثال‌ها باید با پایهٔ تحصیلی و برنامهٔ درسی مدرسه تطبیق داده شود.</p></aside></div>`;
 }
}
function renderQuiz(m){const target=byId('sectionView'),idx=state.quizIndex,answers=state.quizAnswers,done=answers.every(x=>x!==null);if(idx>=m.qs.length){const correct=m.qs.reduce((s,q,i)=>s+(answers[i]===q[2]),0),score=Math.round(100*correct/m.qs.length),old=state.progress[m.id];state.progress[m.id]={done:true,best:Math.max(old?.best||0,score),last:score,finished:new Date().toISOString()};save();renderNav();target.innerHTML=`<section class="card quiz-result"><div class="big-check">${score>=75?'✓':'◎'}</div><span class="eyebrow">نتیجهٔ ارزشیابی</span><h2>${fmt(score)}٪ امتیاز</h2><p>پاسخ درست: ${fmt(correct)} از ${fmt(m.qs.length)} پرسش</p><p>بالاترین نمرهٔ ثبت‌شده: ${fmt(state.progress[m.id].best)}٪ — فقط در این مرورگر ذخیره شده است.</p><div class="score-meter"><span style="width:${score}%"></span></div><button class="primary-btn" id="retryQuiz">آزمون مجدد</button><button class="soft-btn" data-home="true">بازگشت به درس‌ها</button></section>`;byId('retryQuiz').onclick=()=>{state.quizAnswers=Array(m.qs.length).fill(null);state.quizIndex=0;renderQuiz(m)};return}
 const q=m.qs[idx],selected=answers[idx];target.innerHTML=`<section class="card quiz-card"><div class="quiz-header"><div><span class="eyebrow">ارزشیابی تکوینی · ${m.title}</span><h2>دانسته‌هایت را محک بزن</h2></div><span class="question-number">${fmt(idx+1)} / ${fmt(m.qs.length)}</span></div><div class="progress-track"><span style="width:${(idx)/m.qs.length*100}%"></span></div><h3 class="question-text">${q[0]}</h3><div class="answers">${q[1].map((a,i)=>`<button type="button" class="answer ${selected===i?'picked':''} ${selected!==null&&i===q[2]?'correct':''} ${selected===i&&i!==q[2]?'wrong':''}" data-answer="${i}" ${selected!==null?'disabled':''}><span class="answer-letter">${['الف','ب','پ','ت'][i]}</span><span>${a}</span></button>`).join('')}</div>${selected!==null?`<div class="answer-feedback ${selected===q[2]?'good':'bad'}" role="status"><strong>${selected===q[2]?'✓ پاسخ درست':'✗ نیاز به بازبینی'}</strong><p>${q[3]}</p></div>`:''}<div class="quiz-actions"><button class="soft-btn" id="prevQuestion" ${idx===0?'disabled':''}>سؤال قبلی</button><button class="primary-btn" id="nextQuestion" ${selected===null?'disabled':''}>${idx===m.qs.length-1?'دیدن نتیجه':'سؤال بعدی ←'}</button></div></section>`;
 target.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{answers[idx]=Number(el.dataset.answer);renderQuiz(m)});byId('prevQuestion').onclick=()=>{state.quizIndex=Math.max(0,idx-1);renderQuiz(m)};byId('nextQuestion').onclick=()=>{if(answers[idx]===null)return;state.quizIndex++;renderQuiz(m)};
}
function renderOwner(){
 byId('topTitle').textContent='مالکیت و شناسنامه';
 byId('mainContent').innerHTML=`
 <div class="backline"><button class="back-link" data-home="true">→ بازگشت به داشبورد</button></div>
 <div class="owner-banner"><span>♙</span><div><span class="eyebrow">مشخصات درج‌شده در نسخهٔ اختصاصی</span><h1>فیزیک‌نما | Fiziknama</h1><p>نسخهٔ ${VERSION} — آموزش تعاملی فیزیک</p></div></div>
 <div class="owner-grid">
  <section class="card owner-card">
   <h2>مشخصات اعلام‌شدهٔ صاحب پروژه</h2>
   <p>این اطلاعات بر پایهٔ مشخصاتی است که سفارش‌دهنده برای درج در فایل ارائه کرده است؛ تأیید هویت یا گواهی ثبت رسمی نیست.</p>
   <div class="owner-receipt">
    <span>نام اعلام‌شده</span><strong>${esc(PRODUCT_OWNER)}</strong>
    <span>عنوان حرفه‌ای اعلام‌شده</span><strong>${esc(PRODUCT_OWNER_ROLE)}</strong>
    <span>محل فعالیت اعلام‌شده</span><strong>${esc(PRODUCT_OWNER_LOCATION)}</strong>
    <span>نام نرم‌افزار</span><strong>فیزیک‌نما | Fiziknama</strong>
    <span>نسخه</span><strong dir="ltr">${VERSION}</strong>
    <span>تاریخ تهیهٔ ویرایش</span><strong>۲ آبان ۱۴۰۵ / ۲۴ اکتبر ۲۰۲۶</strong>
    <span>وضعیت تأیید حقوقی</span><strong>خوداظهاری؛ بدون تأیید مستقل یا ثبت رسمی</strong>
   </div>
   <button class="soft-btn" id="exportOwner">دریافت شناسنامهٔ اعلامی (JSON)</button>
  </section>
  <section class="card legal-card">
   <h2>چگونه سابقهٔ پروژه را قابل پیگیری کنیم؟</h2>
   <div class="ownership-steps">
    <div><b>۱</b><p>پروژه و مدارک همراه آن را در یک مخزن شخصی و ترجیحاً خصوصی نگهداری کنید.</p></div>
    <div><b>۲</b><p>پس از هر تغییر واقعی در محتوا یا طراحی، Commit و توضیح تصمیم‌های خود را ثبت کنید.</p></div>
    <div><b>۳</b><p>هش SHA-256 نسخهٔ خروجی، آرشیو پروژه، سوابق بازبینی علمی و رسیدهای مستقل را حفظ کنید.</p></div>
    <div><b>۴</b><p>برای سند رسمی یا ادعای حقوق انحصاری، شرایط و مراجع قانونی مرتبط با محل ثبت اثر را بررسی کنید.</p></div>
   </div>

  </section>
 </div>
 <section class="card privacy-note"><h3>حریم خصوصی</h3><p>مشخصات معرفی صاحب پروژه در کد برنامه ثابت است. پیشرفت درسی و نمره‌ها فقط در حافظهٔ مرورگر این دستگاه ذخیره می‌شوند؛ داده‌ای به سرور ارسال نمی‌شود.</p><button class="soft-btn" id="exportProgress">خروجی پیشرفت و نمره‌ها (JSON)</button><button class="danger-text" id="clearProgress">پاک‌کردن نمره‌ها از این دستگاه</button></section>`;
 byId('exportOwner').onclick=()=>downloadJSON('fiziknama-owner-declaration.json',{
  product:'فیزیک‌نما / Fiziknama', version:VERSION,
  named_claimant:PRODUCT_OWNER, self_reported_role:PRODUCT_OWNER_ROLE,
  self_reported_location:PRODUCT_OWNER_LOCATION,
  project_version_date:'2026-10-24', exported_at_device:new Date().toISOString(),
  creation_note:'Developed with generative AI assistance; human contributions must be documented accurately.',
  notice:'Self-declaration; neither an independently verified identity nor legal proof of exclusive ownership.'
 });
 byId('exportProgress').onclick=()=>downloadJSON('fiziknama-progress.json',{version:VERSION,exported_at_device:new Date().toISOString(),progress:state.progress});
 byId('clearProgress').onclick=()=>{if(!confirm('تمام نمره‌های ثبت‌شده در این مرورگر پاک شوند؟'))return;state.progress={};save();renderNav();announce('نمره‌های این مرورگر پاک شدند.')};
}
function announce(msg){const t=byId('toast');t.textContent=msg;t.classList.add('show');clearTimeout(announce.timer);announce.timer=setTimeout(()=>t.classList.remove('show'),4500)}
function downloadJSON(filename,data){const content=JSON.stringify(data,null,2),blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){renderNav();if(state.page==='home')renderHome();else if(state.page==='module')renderModule();else renderOwner();byId('navMobile').classList.remove('open');byId('mobileOverlay').classList.remove('active')}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-home],[data-owner],[data-module],[data-view]');if(!el)return;if(el.dataset.home!==undefined){goHome()}else if(el.dataset.owner!==undefined){goOwner()}else if(el.dataset.module){pick(el.dataset.module)}else if(el.dataset.view){state.view=el.dataset.view;renderModule();byId('sectionView').scrollIntoView({behavior:'smooth',block:'start'})}});
byId('menuToggle').onclick=()=>{byId('navMobile').classList.add('open');byId('mobileOverlay').classList.add('active')};byId('mobileOverlay').onclick=()=>{byId('navMobile').classList.remove('open');byId('mobileOverlay').classList.remove('active')};byId('brandHome').onclick=goHome;byId('brandHome').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome()}});
const hash=(window.location.hash||'').slice(1);if(hash.startsWith('lesson-')&&MODULES.some(m=>m.id===hash.slice(7))){state.selected=hash.slice(7);state.page='module'}else if(hash==='owner'){state.page='owner'}
render();
